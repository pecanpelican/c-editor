[package]
name = "cedit"
version = "0.1.4"
edition = "2024"
rust-version = "1.95"
description = "A native code editor for C, GLSL and Makefiles"
license = "MIT"
readme = "README.md"
keywords = ["editor", "c", "ide", "lsp", "debugger"]
categories = ["development-tools", "text-editors"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["load-images", "pulldown_cmark"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
hayro = { version = "0.9", default-features = false, features = ["embed-cmaps", "embed-fonts"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
portable-pty = "0.9"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.3.0"
vt100 = "0.18"

[profile.release]
strip = true
