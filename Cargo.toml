[package]
name = "cedit"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A native code editor for C, GLSL and Makefiles"
license = "MIT"
readme = "README.md"
keywords = ["editor", "c", "ide", "lsp", "debugger"]
categories = ["development-tools", "text-editors"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.37"
portable-pty = "0.9"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.3.0"
vt100 = "0.18"

[profile.release]
strip = true
